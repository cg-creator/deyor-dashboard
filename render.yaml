services:
  - type: web
    name: deyor-sales-dashboard
    env: node
    rootDir: server
    plan: starter
    buildCommand: |
      npm ci
      cd ..
      npm ci
      npm run build
      cd server
    startCommand: node index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: deyor-salesdb
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

